services:
  app:
    image: ghcr.io/vas3k/pepic:${GITHUB_SHA:-latest}
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8118/}
      STORAGE_DIR: /uploads
      SECRET_CODE: ${SECRET_CODE:?Set SECRET_CODE before starting Pepic}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50M}
    volumes:
      - ./uploads:/uploads
    ports:
      - "127.0.0.1:8118:8118"
    user: "${PEPIC_UID:-1000}:${PEPIC_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
