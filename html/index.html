{% extends "base.html" %}

{% block title %}Upload{% endblock %}

{% block main %}
    <div class="logo">
        <a href="/"><img src="/static/images/logo.png">&nbsp;PEPIC</a>
    </div>

    {% if isAuthorized %}
        <div class="block upload">
            <div class="upload-placeholder">
                <div><span style="font-size: 180%;">🎥 🗃 🖼</span><br>Drag files or click here...</div>
            </div>
            <form action="/upload/multipart/" method="post" class="upload-form" enctype="multipart/form-data">
                <input type="hidden" name="code" value="{{ secretCode }}">
                <input type="file" name="media" class="upload-file" accept="{{ acceptedMediaTypes }}"
                       multiple>
                <button type="submit" class="button upload-submit">Upload</button>
            </form>
        </div>
        <section class="jobs-dashboard" aria-labelledby="jobs-heading" data-poll-seconds="{{ jobPollSeconds }}">
            <h2 id="jobs-heading">Upload jobs</h2>
            <p class="jobs-description">Shared queue for all background uploads.</p>
            <p class="jobs-summary" role="status" aria-live="polite">Loading jobs…</p>
            <div class="jobs-list"></div>
        </section>
        <script src="{{ assetURL("/static/js/upload.js") }}" defer></script>
    {% else %}
        <div class="block auth">
            <form action="" method="get" class="auth-form">
                <label>
                    Secret code
                    <input type="text" name="code" class="auth-input">
                </label>
                <button type="submit" class="button auth-submit">Enter</button>
            </form>
        </div>
    {% endif %}
{% endblock %}
